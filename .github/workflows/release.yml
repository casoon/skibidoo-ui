name: Release

# Tag `vX.Y.Z` → check and build the package, then publish `@casoon/skibidoo-ui`
# to npm with Trusted Publishing (provenance, no stored token) after approval
# in the `npm` environment. The tag must match `package.json`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  # `prepare` installs git hooks; there is no use for them in CI.
  HUSKY: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # pnpm comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v6

      # `engines` asks for Node >= 24.
      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: pnpm install --frozen-lockfile

      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - run: pnpm lint
      - run: pnpm build

  publish-npm:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Update npm (Trusted Publishing needs >= 11.5)
        run: npm install -g npm@latest

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish
        run: npm publish --access public --ignore-scripts
